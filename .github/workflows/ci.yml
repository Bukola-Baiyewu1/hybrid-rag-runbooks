name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # CI never calls a paid model API.
  ANTHROPIC_API_KEY: ""

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: ruff check src scripts tests dashboard
      - run: ruff format --check src scripts tests dashboard
      - run: mypy

  test:
    name: Tests (${{ matrix.store }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [memory, pgvector]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: athena
          POSTGRES_PASSWORD: athena
          POSTGRES_DB: athena_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U athena -d athena_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        env:
          ATHENA_TEST_DATABASE_URL: ${{ matrix.store == 'pgvector' && 'postgresql+psycopg://athena:athena@localhost:5432/athena_test' || '' }}
        run: pytest -q --cov --cov-report=term --cov-fail-under=85

  eval:
    name: Evaluation with the real models
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v4
        with:
          path: .models
          key: fastembed-bge-small-en-v1.5-ms-marco-minilm-l6
      - run: pip install --require-hashes -r requirements.txt
      - name: Retrieval matrix and offline answers (bge-small + cross-encoder, 68 golden questions)
        run: python -m src.eval.run_eval --github
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results/

  aegis:
    name: Aegis agent with Athena as its retriever
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Bukola-Baiyewu1/agentic-devops-assistant
          path: aegis
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .models
          key: fastembed-bge-small-en-v1.5-ms-marco-minilm-l6
      - name: Start Athena over the Aegis runbooks
        run: |
          python -m venv .athena && .athena/bin/pip install -q --require-hashes -r requirements.txt
          ATHENA_CORPUS_DIR=aegis/runbooks nohup .athena/bin/uvicorn src.api.main:app --port 8100 > athena.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8100/ready && break; sleep 2; done
      - name: Compare Aegis retrieval - built-in TF-IDF vs Athena
        working-directory: aegis
        run: |
          python -m venv .venv && .venv/bin/pip install -q --require-hashes -r requirements.txt
          .venv/bin/python -m scripts.eval_retrieval --athena-url http://localhost:8100 | tee comparison.txt
          echo "::notice title=Aegis retrieval: TF-IDF vs Athena::$(tail -n 5 comparison.txt | tr -s ' ' | paste -sd '|')"
      - name: Aegis end to end with Athena (alert -> cited plan citing an Athena passage)
        working-directory: aegis
        env:
          AEGIS_RETRIEVER: athena
          ATHENA_URL: http://localhost:8100
          DATABASE_URL: sqlite:///./ci.db
        run: |
          .venv/bin/python - <<'PY'
          from src import agent
          from src.demo import sim
          from src.rag import AthenaRetriever, get_retriever
          assert isinstance(get_retriever(), AthenaRetriever)
          sim.inject_error()
          result = agent.plan({"event_id": "ci", "name": "High 5xx error rate", "description": "500 errors after deploy", "service": "web"})
          print(result["proposal"]["tool_name"], result["citation"])
          assert result["proposal"]["tool_name"] == "restart_service"
          assert result["citation"]["runbook_version"] == "athena"
          PY
      - name: Athena log on failure
        if: failure()
        run: cat athena.log

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit==2.9.0
      - name: Audit locked dependencies
        run: |
          pip-audit --require-hashes --disable-pip -r requirements.txt
          pip-audit --require-hashes --disable-pip -r requirements-dashboard.txt
      - name: Scan the full git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  container:
    name: Compose stack and smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install httpx==0.28.1
      - name: Build and start pgvector, API, and dashboard
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Smoke test (retrieve, ask, abstain, documents)
        run: python scripts/smoke_test.py http://localhost:8000
      - name: Dashboard is serving
        run: curl -sf http://localhost:8501/_stcore/health
      - name: Containers run as non-root
        run: |
          test "$(docker compose exec -T api id -u)" = "10001"
          test "$(docker compose exec -T dashboard id -u)" = "10001"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
