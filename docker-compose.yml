# One command for the whole stack:  docker compose up --build
#   API        http://localhost:8000/docs   (indexes the corpus on first start)
#   Dashboard  http://localhost:8501
#   pgvector   internal only
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athena-local-only}
      POSTGRES_DB: athena
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    image: athena:local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://athena:${POSTGRES_PASSWORD:-athena-local-only}@db:5432/athena
      ATHENA_AUTO_INGEST: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: athena-dashboard:local
    environment:
      ATHENA_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
